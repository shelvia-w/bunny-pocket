<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cream background circle -->
  <circle cx="50" cy="50" r="50" fill="#FDF8F0"/>
  <!-- Left ear outer -->
  <ellipse cx="32" cy="26" rx="11" ry="22" fill="#FDF8F0" stroke="#F9C5C5" stroke-width="2.5"/>
  <!-- Left ear inner -->
  <ellipse cx="32" cy="27" rx="6" ry="16" fill="#F9C5C5"/>
  <!-- Right ear outer -->
  <ellipse cx="68" cy="26" rx="11" ry="22" fill="#FDF8F0" stroke="#F9C5C5" stroke-width="2.5"/>
  <!-- Right ear inner -->
  <ellipse cx="68" cy="27" rx="6" ry="16" fill="#F9C5C5"/>
  <!-- Head -->
  <ellipse cx="50" cy="63" rx="30" ry="27" fill="#FDF8F0" stroke="#F9C5C5" stroke-width="2"/>
  <!-- Left eye -->
  <circle cx="41" cy="60" r="3.5" fill="#2D2520"/>
  <circle cx="42.2" cy="58.8" r="1" fill="white"/>
  <!-- Right eye -->
  <circle cx="59" cy="60" r="3.5" fill="#2D2520"/>
  <circle cx="60.2" cy="58.8" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="69" rx="3.5" ry="2.5" fill="#F9C5C5"/>
  <!-- Mouth -->
  <path d="M 46 72 Q 50 76 54 72" fill="none" stroke="#F0A0A0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheek blush left -->
  <ellipse cx="36" cy="68" rx="6" ry="4" fill="#F9C5C5" opacity="0.4"/>
  <!-- Cheek blush right -->
  <ellipse cx="64" cy="68" rx="6" ry="4" fill="#F9C5C5" opacity="0.4"/>
</svg>
